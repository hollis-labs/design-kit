# The gate. A rule nobody runs is a guideline.
#
# BLOCKING FROM DAY ONE, AND GREEN ON ARRIVAL. Those are not in tension, and getting
# both is the reason this file looks the way it does. The gate blocks on the packages
# authored clean against the contract, and REPORTS on the pre-contract fork whose
# migration nobody has been asked to do yet. Scope, not suppression.
#
# WHAT THIS REPLACED, BECAUSE THE LESSON IS WORTH MORE THAN THE FILE. The first
# version recorded the fork's two inherited lint errors in .github/lint-baseline.json
# by exact count, and failed the build if the count rose OR FELL — a fall meaning
# someone had fixed one and the baseline was stale. That is a rule about the STATE of
# a mutable file, and it breaks the build when the codebase IMPROVES.
#
#   A gate may assert a PROPERTY OF THE CODE. It may never assert a QUANTITY OF THE
#   CODEBASE. "This package has no violations" is a property. "This file contains
#   exactly two errors" is a census — and a census punishes progress.
#     — Chrispian, 2026-09-11, removing the ratchet
#
# Both gate scripts now have the same shape: a BLOCKING list, a REPORT_ONLY list, and
# no counting. Each REPORT_ONLY entry names the TASK that retires it, because an owner
# with a task beats a tripwire with a number.
#
# NO `command -v tool && tool || echo skipping` ANYWHERE. That idiom prints the skip
# message when the tool runs and finds something, which is why go-envelopes'
# `make vuln` reports a real finding as "not installed". Every step here is its own
# `run:`, so exit codes propagate on their own, and both gate scripts use explicit,
# distinct exit codes rather than boolean chaining.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: typecheck · test · build · lint · design rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Local development is on Node 26 and kit-dashboard carries
          # @types/node ^24; 24 is the closest stable line in Actions. The repo
          # declares no `engines`, so this is the gate's choice, stated here rather
          # than left implicit.
          node-version: '24'
          cache: npm

      # `npm ci` also runs kit-dashboard's `prepare`, which builds dist/. That is
      # deliberate — it is the same path a `github:` tag consumer takes, so a break
      # in it is a break for them.
      - name: install
        run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: test
        run: npm run test:run

      - name: build
        run: npm run build

      # Blocking for packages authored clean; reporting-only for kit-dashboard, the
      # pre-contract fork. Counts nothing, so fixing something never fails the build.
      - name: lint (blocking on authored packages, reporting on the fork)
        run: node .github/scripts/lint-gate.mjs

      # Same policy as the lint step above: blocking for packages authored against
      # the token contract, reporting-only for kit-dashboard. Turned itself on when
      # CW-0124 published the vocabulary.
      - name: design rules (the one rule)
        run: node .github/scripts/design-rules-gate.mjs
